name: Build

permissions:
  contents: read

on:
  push:
    branches-ignore:
      - 'dependabot/**'
  pull_request:
    branches:
      - 'main'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.repository == 'openthread/ot-nrf528xx' && github.run_id) || github.ref }}
  cancel-in-progress: true

jobs:

  pretty:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive
        persist-credentials: false
    - name: Bootstrap
      run: |
        sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15 update
        sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15 --no-install-recommends install -y clang-format-19 shellcheck shfmt
        python3 -m pip install --retries 5 --timeout 30 yapf==0.29.0
    - name: Check
      run: |
        script/make-pretty check

  arm-gcc:
    name: arm-gcc-${{ matrix.gcc_ver }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        gcc_ver: [5, 6, 7, 9]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive
        persist-credentials: false
    - name: Bootstrap
      env:
        GCC_VER: ${{ matrix.gcc_ver }}
      run: |
        sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15 update
        sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15 --no-install-recommends install -y build-essential bzip2 ca-certificates curl lib32z1 ninja-build xz-utils
        openthread/script/install-arm-toolchain.sh "${GCC_VER}" "/tmp/arm-gcc-${GCC_VER}"
    - name: Build
      env:
        GCC_VER: ${{ matrix.gcc_ver }}
      run: |
        export PATH="/tmp/arm-gcc-${GCC_VER}/bin:${PATH}"
        script/test
